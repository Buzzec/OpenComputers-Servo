plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepositories(maven { url = 'https://maven.createmod.net' })
        filter {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    exclusiveContent {
        forRepositories(maven { url = 'https://maven.ithundxr.dev/snapshots' })
        filter { includeGroup 'com.tterrag.registrate' }
    }
    exclusiveContent {
        forRepositories(maven { url = 'https://maven.michiyo.me/releases/' })
        filter { includeGroup 'li.cil.oc' }
    }
    exclusiveContent {
        forRepositories(maven { url = 'https://maven.kotori316.com' })
        filter { includeModule 'com.kotori316', 'scalablecatsforce-neoforge' }
    }
}

neoForge {
    version = neoforge_version

    mods {
        opencomputersservo {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll(
                '--mod', mod_id,
                '--all',
                '--output', file('build/generated/data').absolutePath,
                '--existing', file('src/main/resources').absolutePath
            )
        }
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly("li.cil.oc:opencomputers:${opencomputers_version}:api")
    runtimeOnly("li.cil.oc:opencomputers:${opencomputers_version}")
    runtimeOnly("com.kotori316:scalablecatsforce-neoforge:${scalablecatsforce_version}:with-library") {
        transitive = false
    }

    testImplementation("li.cil.oc:opencomputers:${opencomputers_version}:api")
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('processResources', ProcessResources).configure {
    def replacements = [
        minecraft_version: minecraft_version,
        neoforge_version: neoforge_version,
        create_version: create_version,
        opencomputers_version: opencomputers_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replacements
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replacements
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    classpath += sourceSets.main.compileClasspath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into 'META-INF'
    }
    manifest {
        attributes(
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors
        )
    }
}
